[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = ["pandas", "scikit-learn", "pyyaml", "psycopg[binary]", "python-dotenv", "fastapi", "uvicorn", "pypdf"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
ui = ["gradio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]